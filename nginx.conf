server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Tutor y exámenes del módulo de aprendizaje (portafolio/server)
  location /api/learn- {
    proxy_pass http://learn:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 90s;
  }

  # Chat del portafolio con historial en PostgreSQL (portafolio-chat-backend)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 90s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
